name: Build Atheros modules (AArch64)
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    steps:
    - uses: actions/checkout@v4
    - name: Deps
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git libssl-dev libncurses5-dev liblz4-tool lzop rsync zip zlib1g-dev python2 python3 python-is-python2 cpio xz-utils kmod
    - name: Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 tc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 tc32
    - name: Build modules
      run: |
        mkdir -p arch/arm64/configs
        cp arch/arm/configs/angelica_defconfig arch/arm64/configs/angelica_defconfig
        
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/tc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/tc32/bin/arm-linux-androideabi-
        
        make O=out angelica_defconfig
        
        scripts/config --file out/.config -e MODULES -e MODULE_UNLOAD -e MODVERSIONS
        scripts/config --file out/.config --set-str LOCALVERSION "-perf-g726745c074e7"
        
        scripts/config --file out/.config -d MTK_IMGSENSOR
        scripts/config --file out/.config --set-str CUSTOM_KERNEL_IMGSENSOR ""
        scripts/config --file out/.config --set-str CUSTOM_KERNEL_LCM ""
        
        scripts/config --file out/.config \
          -m MAC80211 -m ATH9K_HTC -m ATH9K_HW -m ATH_COMMON

        yes "" | make O=out oldconfig > /dev/null 2>&1 || true

        if ! make -k O=out -j$(nproc) modules > build.log 2>&1; then
          echo "❌ ERROR TERJADI:"
          tail -n 20 build.log
          exit 1
        fi

        mkdir -p mods
        find out -name '*.ko' -exec cp {} mods/ \;
        ls -l mods
        
        for f in mods/*.ko; do echo "$f"; grep -a -o 'vermagic=[^[:cntrl:]]*' "$f" | head -1; done
        test -s mods/ath9k_htc.ko

    - name: Compile force_insmod (Bare-Metal)
      run: |
        cat << 'CEOF' > force_insmod.c
        #define SYS_write 64
        #define SYS_openat 56
        #define SYS_finit_module 313
        #define SYS_exit 93
        #define AT_FDCWD -100
        #define O_RDONLY 0
        #define MODULE_INIT_IGNORE_MODVERSIONS 1
        #define MODULE_INIT_IGNORE_VERMAGIC 2

        long sys3(long n, long a, long b, long c) {
            register long x8 __asm__("x8") = n;
            register long x0 __asm__("x0") = a;
            register long x1 __asm__("x1") = b;
            register long x2 __asm__("x2") = c;
            __asm__ __volatile__("svc 0" : "+r"(x0) : "r"(x8), "r"(x1), "r"(x2) : "memory");
            return x0;
        }

        long sys4(long n, long a, long b, long c, long d) {
            register long x8 __asm__("x8") = n;
            register long x0 __asm__("x0") = a;
            register long x1 __asm__("x1") = b;
            register long x2 __asm__("x2") = c;
            register long x3 __asm__("x3") = d;
            __asm__ __volatile__("svc 0" : "+r"(x0) : "r"(x8), "r"(x1), "r"(x2), "r"(x3) : "memory");
            return x0;
        }

        void print(const char *s) {
            int len = 0;
            while (s[len]) len++;
            sys3(SYS_write, 1, (long)s, len);
        }

        void load_mod(const char *path) {
            long fd = sys4(SYS_openat, AT_FDCWD, (long)path, O_RDONLY, 0);
            if (fd < 0) {
                print("[-] open failed: ");
                print(path);
                print("\n");
                return;
            }
            long res = sys3(SYS_finit_module, fd, 0, MODULE_INIT_IGNORE_MODVERSIONS | MODULE_INIT_IGNORE_VERMAGIC);
            if (res < 0) {
                print("[-] load failed: ");
                print(path);
                print("\n");
                return;
            }
            print("[+] loaded: ");
            print(path);
            print("\n");
        }

        void _start() {
            load_mod("/data/local/tmp/modules/ath.ko");
            load_mod("/data/local/tmp/modules/ath9k_hw.ko");
            load_mod("/data/local/tmp/modules/ath9k_common.ko");
            load_mod("/data/local/tmp/modules/ath9k_htc.ko");
            sys3(SYS_exit, 0, 0, 0);
        }
        CEOF
        $(pwd)/tc64/bin/aarch64-linux-android-gcc -nostdlib -no-pie -static -Wl,-e,_start force_insmod.c -o force_insmod
        cp force_insmod mods/

    - uses: actions/upload-artifact@v4
      with:
        name: modules
        path: mods/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: modules-log
        path: build.log
