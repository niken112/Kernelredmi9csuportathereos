name: Build Atheros modules
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    steps:
    - uses: actions/checkout@v4
    - name: Deps
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git libssl-dev libncurses5-dev liblz4-tool lzop rsync zip zlib1g-dev python2 python3 python-is-python2 cpio xz-utils kmod
    - name: Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 tc32
    - name: Build modules
      run: |
        export ARCH=arm SUBARCH=arm
        export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-androideabi-
        
        make O=out angelica_defconfig
        
        # Matiin driver yang bikin error karena file-nya nggak ada di source
        scripts/config --file out/.config \
          -d CUSTOM_KERNEL_LCM \
          -d MTK_LCM_HX83012D_VDO_HDP_BOE_TONGXINGDA \
          -d MTK_LCM_NT36525B_VDO_HDP_BOE_DIJING \
          -d MTK_LCM_FT8006S_VDO_HDP_BOE_HELITAI \
          -e MAC80211 -e ATH9K_HTC -e ATH9K_HW -e ATH_COMMON
        
        make -k O=out -j$(nproc) modules 2>&1 | tee build.log || true
        
        mkdir -p mods
        find out -name '*.ko' -exec cp {} mods/ \;
        ls -l mods
        
        for f in mods/*.ko; do echo "$f"; grep -a -o 'vermagic=[^[:cntrl:]]*' "$f" | head -1; done
        test -s mods/ath9k_htc.ko
    - uses: actions/upload-artifact@v4
      with:
        name: modules
        path: mods/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: modules-log
        path: build.log
