name: Build Atheros modules (ARM 32-bit)
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    steps:
    - uses: actions/checkout@v4
    - name: Deps
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git libssl-dev libncurses5-dev liblz4-tool lzop rsync zip zlib1g-dev python2 python3 python-is-python2 cpio xz-utils kmod
    - name: Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 tc32
    - name: Build modules
      run: |
        export ARCH=arm SUBARCH=arm
        export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-androideabi-
        
        # 1. Load config asli
        make O=out angelica_defconfig
        
        # 2. Paksa nyalain fitur modul & samain versi kernel
        scripts/config --file out/.config -e MODULES -e MODULE_UNLOAD -e MODVERSIONS
        scripts/config --file out/.config --set-str LOCALVERSION "-perf-g726745c074e7"
        
        # 3. Benerin LCM (jangan dihapus, tapi dikosongin string-nya biar Kconfig nggak nanya)
        scripts/config --file out/.config --set-str CUSTOM_KERNEL_LCM ""
        
        # 4. Set driver Atheros jadi Modul (-m)
        scripts/config --file out/.config \
          -m MAC80211 -m ATH9K_HTC -m ATH9K_HW -m ATH_COMMON

        # 5. Rapihin dependensi (abaikan error 141 kalau ada)
        yes "" | make O=out oldconfig > /dev/null 2>&1 || true

        # 6. Eksekusi Build & Tangkap Error (Khusus buat lu biar gampang baca)
        echo "=== MULAI BUILD ==="
        if ! make -k O=out -j$(nproc) modules > build.log 2>&1; then
          echo "❌ ERROR TERJADI! INI DIA PESAN ERRORNYA:"
          grep -iE "error:|fatal error:|No rule to make target" build.log | head -n 15
          echo "=========================================="
          exit 1
        fi

        # 7. Kumpulin file .ko
        mkdir -p mods
        find out -name '*.ko' -exec cp {} mods/ \;
        ls -l mods
        
        # 8. Cek vermagic
        for f in mods/*.ko; do echo "$f"; grep -a -o 'vermagic=[^[:cntrl:]]*' "$f" | head -1; done
        test -s mods/ath9k_htc.ko

    - uses: actions/upload-artifact@v4
      with:
        name: modules
        path: mods/
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: modules-log
        path: build.log
