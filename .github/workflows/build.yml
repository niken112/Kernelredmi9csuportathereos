name: Build Kernel Angelica (arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gperf libssl-dev libncurses5-dev liblz4-tool lzop rsync zip zlib1g-dev python2 python3 python-is-python2 cpio xz-utils

    - name: Download toolchains (arm64 + arm32 untuk vDSO compat)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 tc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 tc32

    - name: Build Image.gz
      run: |
        set -o pipefail
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/tc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/tc32/bin/arm-linux-androideabi-

        make O=out angelica_defconfig
        echo "=== cek Atheros di .config ==="
        grep -E "^CONFIG_(MAC80211|ATH9K_HTC|RFKILL)=" out/.config

        make O=out -j$(nproc) Image.gz 2>&1 | tee build.log || { echo "=== ERROR BUILD ==="; tail -n 60 build.log; exit 1; }

        ls -lh out/arch/arm64/boot/
        test -s out/arch/arm64/boot/Image.gz

    - name: Upload Image.gz
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: out/arch/arm64/boot/Image.gz
        if-no-files-found: error

    - name: Upload log + config
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          build.log
          out/.config
