name: Build Kernel Angelica

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies (Ubuntu 20.04)
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3 python-is-python2
        if [ ! -f /usr/bin/python ]; then ln -s /usr/bin/python2 /usr/bin/python; fi

    - name: Download Toolchain
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain

    - name: Build Kernel (Coba Semua Target)
      run: |
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
        
        make O=out angelica_defconfig
        
        echo "=== Mencoba build zImage-dtb ==="
        make O=out -j$(nproc) zImage-dtb 2>&1 | tee build_zImage-dtb.log || true
        
        echo "=== Mencoba build Image-dtb ==="
        make O=out -j$(nproc) Image-dtb 2>&1 | tee build_Image-dtb.log || true
        
        echo "=== Mencoba build zImage ==="
        make O=out -j$(nproc) zImage 2>&1 | tee build_zImage.log || true
        
        echo "=== Mencoba build Image ==="
        make O=out -j$(nproc) Image 2>&1 | tee build_Image.log || true

    - name: CEK ISI FOLDER BOOT
      run: |
        echo "=== ISI FOLDER out/arch/arm/boot/ ==="
        ls -la out/arch/arm/boot/
        echo "=== CARI FILE KERNEL (>1MB) ==="
        find out/arch/arm/boot/ -maxdepth 2 -type f -size +1M -exec ls -lh {} \;

    - name: Upload Semua File Boot
      uses: actions/upload-artifact@v4
      with:
        name: All-Boot-Files
        path: out/arch/arm/boot/*
