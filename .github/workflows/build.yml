name: Build Kernel Angelica

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies (Ubuntu 20.04)
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3 python-is-python2
        if [ ! -f /usr/bin/python ]; then ln -s /usr/bin/python2 /usr/bin/python; fi

    - name: Download Toolchain
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain

    - name: Build Kernel and DTB
      run: |
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
        
        # 1. Load config
        make O=out angelica_defconfig
        
        # 2. Compile Kernel & DTB sekaligus
        make O=out -j$(nproc) 2>&1 | tee build.log || (echo "=== ERROR BUILD ===" && tail -n 50 build.log && exit 1)

        # 3. Lihat file apa saja yang dihasilkan di folder boot
        echo "=== ISI FOLDER BOOT ==="
        ls -la out/arch/arm/boot/

    - name: Gabungin Kernel + DTB
      run: |
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
        
        # Cari file kernel (biasanya zImage atau Image)
        KERNEL_FILE=$(find out/arch/arm/boot/ -maxdepth 1 -type f \( -name "zImage" -o -name "Image" -o -name "Image.gz" \) | head -n 1)
        
        if [ -z "$KERNEL_FILE" ]; then
          echo "❌ File kernel tidak ditemukan! Cek log di atas."
          exit 1
        fi
        
        echo "✅ Kernel ditemukan: $KERNEL_FILE"
        
        # Gabungin dengan DTB
        cat $KERNEL_FILE out/arch/arm/boot/dts/*.dtb > out/arch/arm/boot/Image.gz-dtb
        
        # Bikin zip
        cd out/arch/arm/boot/
        zip Image.gz-dtb.zip Image.gz-dtb

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm/boot/Image.gz-dtb.zip
