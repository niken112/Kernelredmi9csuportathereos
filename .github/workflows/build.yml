name: Build Kernel Angelica arm64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3 python-is-python2 device-tree-compiler
        if [ ! -f /usr/bin/python ]; then ln -s /usr/bin/python2 /usr/bin/python; fi

    - name: Download Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain32

    - name: Build Kernel
      shell: bash
      run: |
        set -eo pipefail
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/toolchain32/bin/arm-linux-androideabi-
        make O=out angelica_defconfig
        make O=out -j$(nproc) KCFLAGS="-Wno-error" -k 2>&1 | tee build.log

    - name: Tampilkan Error
      if: failure()
      run: |
        grep -nE -B2 -A3 "error:|\*\*\* \[|No such file|undefined reference|multiple definition" build.log | head -60 || true

    - name: Cek Isi Folder Boot
      if: always()
      run: |
        cp out/.config kernel.config || true
        ls -la out/arch/arm64/boot/ || true
        find out/arch/arm64/boot/ -maxdepth 4 -type f -size +500k -exec ls -lh {} \; || true

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-arm64
        if-no-files-found: warn
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dts/mediatek/*.dtb

    - name: Upload Config dan Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: config-dan-log
        path: |
          build.log
          kernel.config
